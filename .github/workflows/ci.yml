name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # A manual run is always an explicit request for the complete
          # verification matrix.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "code_changed=true" >> "${GITHUB_OUTPUT}"
            echo "Manual run: full verification requested."
            exit 0
          fi

          # Be conservative for unusual push events where GitHub does not
          # provide a usable previous commit.
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "code_changed=true" >> "${GITHUB_OUTPUT}"
            echo "No usable base SHA: running code verification."
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff \
              --name-only \
              "${BASE_SHA}...${HEAD_SHA}" \
              > changed-files.txt
          else
            git diff \
              --name-only \
              "${BASE_SHA}" \
              "${HEAD_SHA}" \
              > changed-files.txt
          fi

          echo "Changed files:"
          cat changed-files.txt

          code_changed=false

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            # Documentation-only changes do not need compiler, sanitizer,
            # ACVP, or platform matrices. Workflow/build/source changes are
            # deliberately not listed here and therefore trigger full CI.
            case "${file}" in
              README.md|\
              CHANGELOG.md|\
              CONTRIBUTING.md|\
              CODE_OF_CONDUCT.md|\
              SECURITY.md|\
              LICENSE|\
              THIRD_PARTY_NOTICES.md|\
              examples/README.md|\
              docs/*|\
              validation/evidence/*)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done < changed-files.txt

          echo "code_changed=${code_changed}" >> "${GITHUB_OUTPUT}"
          echo "code_changed=${code_changed}"

      - name: Verify ACVP validation boundary
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE \
            'engine/internal|src/core|vppinfra|compat/' \
            -- validation/acvp; then
            echo "::error::validation/acvp must use the public NGI541 API only"
            exit 1
          fi

      - name: Verify production has no libacvp dependency
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE \
            '#include[[:space:]]*[<"][^">]*acvp/' \
            -- src include; then
            echo "::error::Production NGI541 code must not depend on libacvp"
            exit 1
          fi

      - name: Verify sanitizer policy
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE \
            'no_sanitize|no_sanitize_address|no_sanitize_undefined' \
            -- \
            src \
            include \
            tests \
            cmake \
            scripts \
            CMakeLists.txt; then
            echo "::error::NGI541 code must not disable sanitizer instrumentation"
            exit 1
          fi

          if git grep -nE \
            'suppressions[[:space:]]*=' \
            -- \
            src \
            include \
            tests \
            cmake \
            scripts \
            CMakeLists.txt; then
            echo "::error::NGI541 sanitizer suppressions are not permitted"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import sys

          needle = "suppres" + "sions="

          violations = []

          for path in Path(".github/workflows").glob("*.y*ml"):
              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  1,
              ):
                  if needle in line:
                      violations.append(
                          (path, line_number, line.strip())
                      )

          if violations:
              for path, line_number, line in violations:
                  print(
                      f"::error file={path},line={line_number}::"
                      f"sanitizer suppression option is not permitted: "
                      f"{line}"
                  )

              sys.exit(1)
          PY

      - name: Verify online ACVP probe is network-free
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("validation/acvp/online_build_probe.c")
          source = path.read_text(encoding="utf-8")

          # Strip C block comments while preserving line numbers.
          def strip_block_comment(match):
              return "".join(
                  "\n" if ch == "\n" else " "
                  for ch in match.group(0)
              )

          source = re.sub(
              r"/\*.*?\*/",
              strip_block_comment,
              source,
              flags=re.DOTALL,
          )

          # Strip C++-style line comments.
          source = re.sub(
              r"//[^\n]*",
              "",
              source,
          )

          forbidden = (
              "acvp_run",
              "acvp_set_server",
              "acvp_set_certkey",
              "acvp_set_2fa_callback",
          )

          violations = []

          for name in forbidden:
              pattern = re.compile(
                  rf"\b{re.escape(name)}\s*\("
              )

              for match in pattern.finditer(source):
                  line = source.count(
                      "\n",
                      0,
                      match.start(),
                  ) + 1

                  violations.append(
                      (line, name)
                  )

          if violations:
              for line, name in violations:
                  print(
                      f"::error file={path},line={line}::"
                      f"online_build_probe must not call {name}()"
                  )

              sys.exit(1)
          PY

  # ---------------------------------------------------------------------------
  # Post-merge verification
  #
  # Pull requests receive the exhaustive matrix below. A push to main therefore
  # only needs a compact verification of the actual resulting main commit.
  # ---------------------------------------------------------------------------

  main-smoke:
    name: Main / Linux / Clang / Release
    needs:
      - boundaries
    if: >-
      github.event_name == 'push' &&
      needs.boundaries.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "CC=clang" >> "${GITHUB_ENV}"
          clang --version

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNGI541_BUILD_ENGINE=ON \
            -DNGI541_BUILD_TESTS=ON \
            -DNGI541_BUILD_DIFFERENTIAL_TESTS=ON \
            -DNGI541_BUILD_ACVP=OFF

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Test
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --no-tests=error

  # ---------------------------------------------------------------------------
  # Exhaustive core matrix
  #
  # Runs for code-changing pull requests and explicit manual verification.
  # Feature-branch pushes do not trigger a duplicate workflow.
  # ---------------------------------------------------------------------------

  build-test:
    name: Core / Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    needs:
      - boundaries
    if: >-
      github.event_name != 'push' &&
      needs.boundaries.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        compiler:
          - gcc
          - clang
        build_type:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "${GITHUB_ENV}"
          else
            echo "CC=clang" >> "${GITHUB_ENV}"
          fi

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNGI541_BUILD_ENGINE=ON \
            -DNGI541_BUILD_TESTS=ON \
            -DNGI541_BUILD_DIFFERENTIAL_TESTS=ON \
            -DNGI541_BUILD_ACVP=OFF

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Run public API conformance gate
        run: |
          ctest \
            --test-dir build \
            -R '^public\.(engine_not_initialized|api_validation)$' \
            --output-on-failure \
            --no-tests=error

      - name: Run remaining test suite
        run: |
          ctest \
            --test-dir build \
            -E '^public\.(engine_not_initialized|api_validation)$' \
            --output-on-failure \
            --no-tests=error

  build-test-macos:
    name: Core / macOS / ${{ matrix.compiler }} / Debug
    needs:
      - boundaries
    if: >-
      github.event_name != 'push' &&
      needs.boundaries.outputs.code_changed == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30

    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        include:
          - compiler: apple-clang
            cc: /usr/bin/clang

          - compiler: gcc-15
            cc: gcc-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "CC=${{ matrix.cc }}" >> "${GITHUB_ENV}"
          "${{ matrix.cc }}" --version

      - name: Configure OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          fi

          echo \
            "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" \
            >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNGI541_BUILD_ENGINE=ON \
            -DNGI541_BUILD_TESTS=ON \
            -DNGI541_BUILD_DIFFERENTIAL_TESTS=ON \
            -DNGI541_BUILD_ACVP=OFF

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Run differential correctness gate
        run: |
          ctest \
            --test-dir build \
            -R '^differential\.' \
            --output-on-failure \
            --no-tests=error

      - name: Run remaining test suite
        run: |
          ctest \
            --test-dir build \
            -E '^differential\.' \
            --output-on-failure \
            --no-tests=error

  # ---------------------------------------------------------------------------
  # Full Linux/Clang sanitizer evidence
  #
  # The previous workflow built Linux/Clang ASan, UBSan, and ASan+UBSan twice:
  # once for smoke/instrumentation checks and again for full suites. These jobs
  # combine instrumentation verification with the full suites, preserving the
  # checks while eliminating the duplicate builds.
  # ---------------------------------------------------------------------------

  sanitizer-full:
    name: Sanitizer full / Linux / Clang / ${{ matrix.profile }}
    needs:
      - boundaries
    if: >-
      github.event_name != 'push' &&
      needs.boundaries.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        include:
          - profile: ASan+LSan
            artifact: asan-lsan
            asan: "ON"
            ubsan: "OFF"
            require_lsan: true
            asan_options: "halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:detect_leaks=1"
            ubsan_options: ""
            lsan_options: "exitcode=23"

          - profile: UBSan
            artifact: ubsan
            asan: "OFF"
            ubsan: "ON"
            require_lsan: false
            asan_options: ""
            ubsan_options: "halt_on_error=1:print_stacktrace=1"
            lsan_options: ""

          - profile: ASan+UBSan
            artifact: asan-ubsan
            asan: "ON"
            ubsan: "ON"
            require_lsan: false
            asan_options: "halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1"
            ubsan_options: "halt_on_error=1:print_stacktrace=1"
            lsan_options: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux test dependencies
        shell: bash
        run: |
          set -euo pipefail

          if ! dpkg-query \
            -W \
            -f='${Status}' \
            libssl-dev \
            2>/dev/null \
            | grep -q 'ok installed'; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev
          fi

      - name: Prepare sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/bootstrap-sanitizer-deps.sh \
            --install \
            --compiler clang

      - name: Verify sanitizer toolchain
        if: ${{ matrix.require_lsan == false }}
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/bootstrap-sanitizer-deps.sh \
            --check \
            --compiler clang

      - name: Require functional LeakSanitizer
        if: ${{ matrix.require_lsan == true }}
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/bootstrap-sanitizer-deps.sh \
            --check \
            --compiler clang \
            --require-lsan

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "CC=clang" >> "${GITHUB_ENV}"
          clang --version

      - name: Configure sanitizer build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-sanitizer \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNGI541_BUILD_ENGINE=ON \
            -DNGI541_BUILD_TESTS=ON \
            -DNGI541_BUILD_DIFFERENTIAL_TESTS=ON \
            -DNGI541_BUILD_ACVP=OFF \
            -DNGI541_ENABLE_ASAN=${{ matrix.asan }} \
            -DNGI541_ENABLE_UBSAN=${{ matrix.ubsan }}

      - name: Build sanitizer configuration
        run: |
          cmake \
            --build build-sanitizer \
            --parallel

      - name: Verify production instrumentation
        shell: bash
        env:
          EXPECT_ASAN: ${{ matrix.asan }}
          EXPECT_UBSAN: ${{ matrix.ubsan }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          database_path = Path(
              "build-sanitizer/compile_commands.json"
          )

          with database_path.open(
              encoding="utf-8"
          ) as file:
              commands = json.load(file)

          targets = (
              "src/engine/native.c",
              "src/engine/execute.c",
              "src/engine/handlers/aes_cbc.c",
              "src/engine/handlers/aes_ctr.c",
              "src/engine/handlers/aes_gcm.c",
              "src/engine/handlers/sha2.c",
          )

          expect_asan = (
              os.environ["EXPECT_ASAN"] == "ON"
          )

          expect_ubsan = (
              os.environ["EXPECT_UBSAN"] == "ON"
          )

          failed = False

          for target in targets:
              matches = [
                  entry
                  for entry in commands
                  if entry["file"].endswith(target)
              ]

              if not matches:
                  print(
                      f"FAIL: missing compile command: "
                      f"{target}"
                  )
                  failed = True
                  continue

              command = matches[0].get(
                  "command",
                  ""
              )

              required = [
                  "-fno-omit-frame-pointer",
                  "-fno-optimize-sibling-calls",
              ]

              if expect_asan:
                  required.append(
                      "-fsanitize=address"
                  )

              if expect_ubsan:
                  required.extend(
                      (
                          "-fsanitize=undefined",
                          "-fno-sanitize-recover=all",
                      )
                  )

              missing = [
                  flag
                  for flag in required
                  if flag not in command
              ]

              if missing:
                  print(
                      f"FAIL: {target}: "
                      f"missing {', '.join(missing)}"
                  )
                  failed = True
              else:
                  print(
                      f"PASS: {target}"
                  )

          if failed:
              sys.exit(1)
          PY

      - name: Run buffer geometry regression gate
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          LSAN_OPTIONS: ${{ matrix.lsan_options }}
        run: |
          set -euo pipefail

          ctest \
            --test-dir build-sanitizer \
            -R '^robustness\.buffer_geometry$' \
            --output-on-failure \
            --no-tests=error

      - name: Run remaining full sanitizer suite
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          LSAN_OPTIONS: ${{ matrix.lsan_options }}
        run: |
          set -euo pipefail

          ctest \
            --test-dir build-sanitizer \
            -E '^robustness\.buffer_geometry$' \
            --output-on-failure \
            --no-tests=error

      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-full-${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            build-sanitizer/compile_commands.json
            build-sanitizer/Testing/Temporary/LastTest.log
            build-sanitizer/CMakeFiles/*.log

  # ---------------------------------------------------------------------------
  # Cross-toolchain/platform sanitizer compatibility
  #
  # Full sanitizer evidence is collected above on Linux/Clang. These two jobs
  # preserve the previous GCC and macOS combined-sanitizer coverage as smoke
  # and instrumentation checks.
  # ---------------------------------------------------------------------------

  sanitizer-compat:
    name: Sanitizer compat / ${{ matrix.platform }} / ${{ matrix.compiler }}
    needs:
      - boundaries
    if: >-
      github.event_name != 'push' &&
      needs.boundaries.outputs.code_changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            compiler: gcc
            cc: gcc
            bootstrap_compiler: gcc

          - platform: macOS
            runner: macos-15-intel
            compiler: apple-clang
            cc: /usr/bin/clang
            bootstrap_compiler: clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          if ! dpkg-query \
            -W \
            -f='${Status}' \
            libssl-dev \
            2>/dev/null \
            | grep -q 'ok installed'; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev
          fi

      - name: Prepare Linux sanitizer toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/bootstrap-sanitizer-deps.sh \
            --install \
            --compiler "${{ matrix.bootstrap_compiler }}"

      - name: Verify macOS sanitizer toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/bootstrap-sanitizer-deps.sh \
            --check \
            --compiler "${{ matrix.bootstrap_compiler }}"

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "CC=${{ matrix.cc }}" >> "${GITHUB_ENV}"
          "${{ matrix.cc }}" --version

      - name: Configure OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          fi

          echo \
            "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" \
            >> "${GITHUB_ENV}"

      - name: Configure sanitizer build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-sanitizer \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNGI541_BUILD_ENGINE=ON \
            -DNGI541_BUILD_TESTS=ON \
            -DNGI541_BUILD_DIFFERENTIAL_TESTS=ON \
            -DNGI541_BUILD_ACVP=OFF \
            -DNGI541_ENABLE_ASAN=ON \
            -DNGI541_ENABLE_UBSAN=ON

      - name: Build sanitizer configuration
        run: |
          cmake \
            --build build-sanitizer \
            --parallel

      - name: Verify production instrumentation
        shell: bash
        env:
          EXPECT_ASAN: "ON"
          EXPECT_UBSAN: "ON"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          database_path = Path(
              "build-sanitizer/compile_commands.json"
          )

          with database_path.open(
              encoding="utf-8"
          ) as file:
              commands = json.load(file)

          targets = (
              "src/engine/native.c",
              "src/engine/execute.c",
              "src/engine/handlers/aes_cbc.c",
              "src/engine/handlers/aes_ctr.c",
              "src/engine/handlers/aes_gcm.c",
              "src/engine/handlers/sha2.c",
          )

          expect_asan = (
              os.environ["EXPECT_ASAN"] == "ON"
          )

          expect_ubsan = (
              os.environ["EXPECT_UBSAN"] == "ON"
          )

          failed = False

          for target in targets:
              matches = [
                  entry
                  for entry in commands
                  if entry["file"].endswith(target)
              ]

              if not matches:
                  print(
                      f"FAIL: missing compile command: "
                      f"{target}"
                  )
                  failed = True
                  continue

              command = matches[0].get(
                  "command",
                  ""
              )

              required = [
                  "-fno-omit-frame-pointer",
                  "-fno-optimize-sibling-calls",
                  "-fsanitize=address",
                  "-fsanitize=undefined",
                  "-fno-sanitize-recover=all",
              ]

              missing = [
                  flag
                  for flag in required
                  if flag not in command
              ]

              if missing:
                  print(
                      f"FAIL: {target}: "
                      f"missing {', '.join(missing)}"
                  )
                  failed = True
              else:
                  print(
                      f"PASS: {target}"
                  )

          if failed:
              sys.exit(1)
          PY

      - name: Run sanitizer compatibility smoke tests
        shell: bash
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail

          ctest \
            --test-dir build-sanitizer \
            -R '^(public\.api_runtime|crypto\.sha256_kat|crypto\.aes_gcm_kat|engine\.smoke)$' \
            --output-on-failure \
            --no-tests=error

      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            sanitizer-compat-${{ matrix.platform }}-${{ matrix.compiler }}
          if-no-files-found: ignore
          path: |
            build-sanitizer/compile_commands.json
            build-sanitizer/Testing/Temporary/LastTest.log
            build-sanitizer/CMakeFiles/*.log

  # ---------------------------------------------------------------------------
  # ACVP validation
  # ---------------------------------------------------------------------------

  acvp-validation:
    name: ACVP / ${{ matrix.compiler }} / Debug
    needs:
      - boundaries
    if: >-
      github.event_name != 'push' &&
      needs.boundaries.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install ACVP build dependencies
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            autoconf
            automake
            libtool
            pkg-config
            libssl-dev
            libcurl4-openssl-dev
          )

          missing=()

          for package in "${packages[@]}"; do
            if ! dpkg-query \
              -W \
              -f='${Status}' \
              "${package}" \
              2>/dev/null \
              | grep -q 'ok installed'; then
              missing+=("${package}")
            fi
          done

          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "${GITHUB_ENV}"
          else
            echo "CC=clang" >> "${GITHUB_ENV}"
          fi

      - name: Show libacvp revision
        run: |
          git -C third_party/libacvp rev-parse HEAD
          git submodule status third_party/libacvp

      - name: Configure ACVP validation build
        run: |
          cmake \
            -S . \
            -B build-acvp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNGI541_BUILD_ENGINE=ON \
            -DNGI541_BUILD_TESTS=ON \
            -DNGI541_BUILD_ACVP=ON

      - name: Build ACVP validation
        run: |
          cmake \
            --build build-acvp \
            --parallel

      - name: ACVP runner smoke test
        run: |
          ./build-acvp/validation/acvp/ngi541_acvp

      - name: ACVP registration smoke test
        run: |
          ./build-acvp/validation/acvp/ngi541_acvp \
            --registration \
            > build-acvp/acvp-registration.json

      - name: Run ACVP negative validation gate
        run: |
          ctest \
            --test-dir build-acvp \
            -R '^acvp\.(aes_gcm_callback_negative|aes_cbc_ctr_callback_negative|sha_callback_negative)$' \
            --output-on-failure \
            --no-tests=error

      - name: Run remaining test suite
        run: |
          ctest \
            --test-dir build-acvp \
            -E '^acvp\.(aes_gcm_callback_negative|aes_cbc_ctr_callback_negative|sha_callback_negative)$' \
            --output-on-failure \
            --no-tests=error

      - name: Run ACVP tests verbosely
        if: failure()
        run: |
          ctest \
            --test-dir build-acvp \
            -R '^acvp\.' \
            --output-on-failure \
            -V || true

      - name: Upload ACVP diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acvp-diagnostics-${{ matrix.compiler }}
          if-no-files-found: ignore
          path: |
            build-acvp/Testing/Temporary/LastTest.log
            build-acvp/tests/acvp/*_response.json
            build-acvp/acvp-registration.json

  acvp-online-build:
    name: ACVP Online Build / ${{ matrix.compiler }} / Debug
    needs:
      - boundaries
    if: >-
      github.event_name != 'push' &&
      needs.boundaries.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install ACVP build dependencies
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            autoconf
            automake
            libtool
            pkg-config
            libssl-dev
          )

          missing=()

          for package in "${packages[@]}"; do
            if ! dpkg-query \
              -W \
              -f='${Status}' \
              "${package}" \
              2>/dev/null \
              | grep -q 'ok installed'; then
              missing+=("${package}")
            fi
          done

          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Bootstrap online ACVP dependencies
        run: |
          ./scripts/bootstrap-acvp-online-deps.sh

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "${GITHUB_ENV}"
          else
            echo "CC=clang" >> "${GITHUB_ENV}"
          fi

      - name: Show pinned libacvp revision
        run: |
          git -C third_party/libacvp rev-parse HEAD
          git submodule status third_party/libacvp

      - name: Show libcurl environment
        shell: bash
        run: |
          set -euo pipefail

          pkg-config --modversion libcurl
          pkg-config --variable=prefix libcurl
          pkg-config --cflags libcurl
          pkg-config --libs libcurl

      - name: Configure online ACVP build
        run: |
          cmake \
            -S . \
            -B build-acvp-online \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNGI541_BUILD_ENGINE=ON \
            -DNGI541_BUILD_TESTS=ON \
            -DNGI541_BUILD_ACVP=ON \
            -DNGI541_ENABLE_ACVP_ONLINE=ON

      - name: Build online ACVP probe
        run: |
          cmake \
            --build build-acvp-online \
            --target ngi541_acvp_online_probe \
            --parallel

      - name: Run online ACVP build probe
        run: |
          ctest \
            --test-dir build-acvp-online \
            -R '^acvp\.online_build_probe$' \
            --output-on-failure \
            --no-tests=error
